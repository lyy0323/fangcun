    var CL_COLORS = {"第1部_平":{"h":198,"s":80,"l":80,"ring":"东"},"第1部_仄":{"h":198,"s":80,"l":25,"ring":"董"},"第2部_平":{"h":30,"s":80,"l":80,"ring":"江"},"第2部_仄":{"h":51,"s":80,"l":25,"ring":"讲"},"第3部_平":{"h":237,"s":80,"l":80,"ring":"支"},"第3部_仄":{"h":231,"s":80,"l":26,"ring":"纸"},"第4部_平":{"h":66,"s":80,"l":80,"ring":"鱼"},"第4部_仄":{"h":66,"s":80,"l":25,"ring":"语"},"第5部_平":{"h":258,"s":80,"l":80,"ring":"佳"},"第5部_仄":{"h":258,"s":80,"l":25,"ring":"蟹"},"第6部_平":{"h":96,"s":80,"l":80,"ring":"真"},"第6部_仄":{"h":102,"s":80,"l":25,"ring":"轸"},"第7部_平":{"h":126,"s":80,"l":80,"ring":"元"},"第7部_仄":{"h":126,"s":80,"l":25,"ring":"阮"},"第8部_平":{"h":336,"s":80,"l":80,"ring":"萧"},"第8部_仄":{"h":342,"s":80,"l":25,"ring":"筱"},"第9部_平":{"h":0,"s":80,"l":80,"ring":"歌"},"第9部_仄":{"h":6,"s":80,"l":25,"ring":"哿"},"第10部_平":{"h":12,"s":80,"l":80,"ring":"麻"},"第10部_仄":{"h":18,"s":80,"l":25,"ring":"马"},"第11部_平":{"h":168,"s":80,"l":80,"ring":"庚"},"第11部_仄":{"h":171,"s":80,"l":25,"ring":"梗"},"第12部_平":{"h":48,"s":80,"l":80,"ring":"尤"},"第12部_仄":{"h":48,"s":80,"l":25,"ring":"有"},"第13部_平":{"h":312,"s":80,"l":80,"ring":"侵"},"第13部_仄":{"h":312,"s":80,"l":25,"ring":"寝"},"第14部_平":{"h":288,"s":80,"l":80,"ring":"覃"},"第14部_仄":{"h":288,"s":80,"l":25,"ring":"感"},"第15部_入":{"h":198,"s":30,"l":20,"ring":"屋"},"第16部_入":{"h":30,"s":30,"l":20,"ring":"觉"},"第17部_入":{"h":158,"s":30,"l":20,"ring":"质"},"第18部_入":{"h":123,"s":30,"l":20,"ring":"物"},"第19部_入":{"h":288,"s":30,"l":20,"ring":"合"}};
    function itemColor(b, cats) {
      if (!cats.length) return '#8a8178';
      var first = cats[0];
      if (b.key === 'Pingshuiyun') {
        var c = PS_COLORS[first.name];
        if (c) return 'hsl(' + c[0] + ',' + c[1] + '%,' + c[2] + '%)';
      }
      if (b.key === 'Cilinzhengyun') {
        var c2 = CL_COLORS[first.name];
        if (c2) return 'hsl(' + c2.h + ',' + c2.s + '%,' + c2.l + '%)';
      }
      return toneColor(first.tone_type);
    }
    async function query() {
      var text = input.value.trim();
      var m = text.match(/[\u3400-\u9fff]/);
      if (!m) { resultEl.innerHTML = '<div class="empty">请输入一个汉字</div>'; return; }
      var char = m[0];
      resultEl.innerHTML = '<div class="loading">查询中…</div>';
      try {
        var jobs = BOOKS.map(function (b) {
          return fetch(CHECKER + '/char/lookup?char=' + enc(char) + '&book=' + enc(b.key))
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        });
        jobs.push(fetch('/api/char/definitions?char=' + enc(char))
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; }));
        var res = await Promise.all(jobs);
        render(char, res);
      } catch (e) {
        resultEl.innerHTML = '<div class="empty">查询失败，请检查网络后重试</div>';
      }
    }
    function render(char, res) {
      var defs = (res[4] && res[4].definitions) || [];
      var html = '<div class="char-hero"><span class="big">' + char + '</span></div>';
      // 释义（紧凑直排，无标题）
      if (defs.length) {
        html += '<div class="def-block">';
        defs.forEach(function (rd) {
          html += '<div class="def-reading"><div class="def-py">' + (rd.py || '') + '</div>';
          rd.defs.forEach(function (d, di) {
            html += '<div class="def-item"><span class="def-no">' + '①②③④⑤⑥⑦⑧⑨⑩'[di] + '</span><span>' + d.d + '</span>';
            if (d.c) html += '<div class="def-c">' + d.c + '</div>';
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
      }
      // 音韵地位 · 时间线（上古 → 平水 → 词林 → 新韵）
      html += '<div class="timeline">';
      BOOKS.forEach(function (b, bi) {
        var data = res[bi];
        var cats = (data && data.rhyme_categories) || [];
        var href = BOOK_PAGE[b.key] + '?q=' + enc(char);
        var dotColor = itemColor(b, cats);
        html += '<div class="tl-item"><span class="tl-dot" style="background:' + dotColor + '"></span>';
        html += '<div class="tl-head">' + b.label + '</div><div class="tl-body">';
        if (!cats.length) {
          html += '<span class="empty" style="padding:2px 0">未收录</span>';
        } else {
          cats.forEach(function (c) {
            var col = (b.key === 'Pingshuiyun' || b.key === 'Cilinzhengyun') ? itemColor(b, cats) : toneColor(c.tone_type);
            if (b.key === 'Shangguyun' && c.readings && c.readings.length) {
              c.readings.forEach(function (r) {
                html += '<div class="sg-line"><a class="chip" style="color:' + col + ';border-color:' + col + '40;background:' + col + '10" href="' + href + '">' + c.name + '</a>' +
                  '<span class="sg-reading">' + r.sub + ' · ' + r.py + (r.rpy ? '（' + r.rpy + '）' : '') + '</span></div>';
              });
            } else {
              html += '<a class="chip" style="color:' + col + ';border-color:' + col + '40;background:' + col + '10" href="' + href + '">' + c.name + '</a>';
            }
          });
        }
        html += '</div></div>';
      });
      html += '</div>';
      html += '</div>';
      resultEl.innerHTML = html;
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(query, 250); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(timer); query(); } });
    // 空闲态：100 常用字分两行玻璃卡片墙——每次乱序、第二行反向滚动、可拖拽、随机浅彩底
    var COMMON = '天地人日月山水风云雨雪春夏秋冬江海河湖波潮花草树木石玉火土田竹梅兰菊荷松柏柳桃李杏诗词歌赋文章琴棋书画笔墨纸砚亭台楼阁门窗桥路马车舟剑弓箭灯钟龙凤虎鹤燕雀鱼鸟虫兽酒茶米盐肉豆果瓜菜香红黄蓝白黑金银铜铁';
    function shuffleArr(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function startRowScroll(rowEl, dir) {
      var offset = 0, raf = null, dragging = false, startX = 0, startOffset = 0;
      rowEl.__moved = false;
      function step() {
        if (!rowEl.isConnected) return;
        offset += 0.35 * dir;
        var half = rowEl.scrollWidth / 2;
        if (offset < -half) offset += half;
        if (offset > 0) offset -= half;
        rowEl.style.transform = 'translateX(' + offset + 'px)';
        raf = requestAnimationFrame(step);
      }
      rowEl.addEventListener('pointerdown', function (e) {
        dragging = true; rowEl.__moved = false; cancelAnimationFrame(raf);
        startX = e.clientX; startOffset = offset;
        rowEl.setPointerCapture(e.pointerId);
        rowEl.style.cursor = 'grabbing';
      });
      rowEl.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > 5) rowEl.__moved = true;
        offset = startOffset + (e.clientX - startX);
        var half = rowEl.scrollWidth / 2;
        if (offset < -half) offset += half;
        if (offset > 0) offset -= half;
        rowEl.style.transform = 'translateX(' + offset + 'px)';
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false; rowEl.style.cursor = '';
        raf = requestAnimationFrame(step);
      }
      rowEl.addEventListener('pointerup', endDrag);
      rowEl.addEventListener('pointercancel', endDrag);
      raf = requestAnimationFrame(step);
    }
    (function initIdle() {
      var chars = shuffleArr(COMMON.split(''));
      var rows = document.querySelectorAll('.char-row');
      if (!rows.length) return;
      [chars.slice(0, 50), chars.slice(50)].forEach(function (list, ri) {
        var rowEl = rows[ri];
        var html = '';
        list.concat(list).forEach(function (c, i) {
          var tilt = ((i * 7) % 5) - 2;
          var hue = Math.floor(Math.random() * 360);
          html += '<button class="char-card" data-ch="' + c + '" style="--tilt:' + tilt + 'deg;--h:' + hue + ';--i:' + i + '">' + c + '</button>';
        });
        rowEl.innerHTML = html;
        startRowScroll(rowEl, ri === 0 ? -1 : 1);
      });
      document.querySelectorAll('.char-row').forEach(function (row) {
        row.addEventListener('click', function (e) {
          if (row.__moved) return; // 拖拽过则不触发查询
          var card = e.target.closest ? e.target.closest('.char-card') : null;
          if (card) { input.value = card.getAttribute('data-ch'); query(); }
        });
      });
    })();
    // ?q=字 自动查询（韵书页韵字点击跳转而来）
    var initQ = new URLSearchParams(location.search).get('q');
    if (initQ) { input.value = initQ; query(); }
  })();
